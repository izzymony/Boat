<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" type="text/css" href="tailwind.css" />
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body>
  
    <main class="px-4 mt-44   ">
        <h1 class="font-bold text-2xl py-3 font-clash-display font-bold">Contact Us</h1>
        <p class="font-sora w-50 py-3 text-lg">Leave us your details and we will get back to you soon</p>
        <form  action="send-email.php" class="py-5" id="myForm">
            <input type="text" id="name" name="name" placeholder="Enter your name" class=" border w-full rounded-lg  p-3 border-black-600">
            <div id="name-error" style="color: red;"></div>
            <input type="text" name="surname" id="surname" placeholder="Enter your surname" class=" border w-full rounded-lg  p-3 mt-3 border-black-600">
            <div id="surname-error" style="color: red;"></div>
            <input type="text" id="email" name="email" placeholder="Email" class=" border w-full rounded-lg  p-3 border-black-600 mt-3">
            <div id="email-error" style="color: red;"></div>
            <textarea name="" id="message" placeholder="Message" class=" border w-full rounded-lg  p-3 border-black-600 mt-3"></textarea>
            <div id="message-error" style="color: red;"></div>
            <button class="bg-black p-2 w-full mt-3 rounded-lg text-white font-clash-display"><p class="font-clash-display font-medium"> Send</p></button>
        </form>
    </main>

    <script src="contact.js"></script>
</body>
</html>
