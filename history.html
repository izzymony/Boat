<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" type="text/css" href="tailwind.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
</head>
<body class="bg-gray-50">
    <div class="container mx-auto px-4 py-8">
        <div class="max-w-6xl mx-auto">
            <!-- Header -->
            <div class="flex justify-between items-center mb-8">
                <h1 class="text-3xl font-bold text-gray-800">My Bookings</h1>
                <a href="Booking.html" class="flex items-center text-blue-600 hover:text-blue-800">
                    <i class="fas fa-plus mr-2"></i>
                    New Booking
                </a>
            </div>
            
            <!-- Bookings List -->
            <div id="bookingsList" class="space-y-6">
                <!-- Bookings will be inserted here by JavaScript -->
                <div class="text-center py-12">
                    <i class="fas fa-ship text-4xl text-gray-300 mb-4"></i>
                    <h3 class="text-xl font-medium text-gray-500">No bookings yet</h3>
                    <p class="text-gray-400">Your upcoming bookings will appear here</p>
                    <a href="Booking.html" class="mt-4 inline-block bg-blue-600 hover:bg-blue-700 text-white py-2 px-6 rounded-lg transition duration-200">
                        Book Now
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="history.js">
        
    </script>
</body>
</html>
