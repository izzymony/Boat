<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" type="text/css" href="tailwind.css" />
    <script src="signIn.js" type="module"></script>
  </head>
  <body
    style="background-image: url('image/pexels-pixabay-163236.jpg')"
    class="h-screen bg-cover bg-center w-full"
  >
    <main class="px-4">
      <div class="flex flex-col items-center justify-center h-screen">
        <form>
          <div
            class="w-full p-6 py-10 rounded-lg shadow-lg bg-transparent"
            style="
              background-color: rgba(255, 255, 255, 0.1);
              box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
              backdrop-filter: blur(10px);
            "
          >
            <input
              type="email"
              placeholder="Email"
              name="email"
              class="p-3 w-full border-gray-500 border rounded-lg font-sora"
            />
            <input
              type="password"
              name="password"
              id="password"
              placeholder="Password"
              class="p-3 mt-3 border-gray-500 border w-full rounded-lg placeholder:text-black font-medium font-sora"
            />
            <button
              type="submit"
              class="bg-black text-white font-bold font-sora py-2 px-4 rounded-lg mt-3 w-full font-clash-display text-lg"
            >
              <p class="font-clash-display">Sign In</p>
            </button>

            <button
              class="btn mt-9 w-full bg-black rounded-lg text-white p-3 font-sora"
              id="google-auth-btn"
            >
              <div class="flex text-center align-center justify-center gap-2">
                <img src="image/icons8-google-50.png" alt="" class="h-6 w-6" />
                <p class="font-clash-display">Sign-in with Google</p>
              </div>
            </button>
            <p class="mt-5 text-white ">Don't have an account? <a href="signup.html" class="text-black underline">Register here</a> </p>
          </div>
          
        </form>
      </div>
    </main>
  </body>
</html>
